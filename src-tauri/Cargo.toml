[package]
name = "app"
version = "0.1.0"
description = "Tauri + React + PostgreSQL"
authors = ["you"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",  # вместо async-std
    "postgres",
    "chrono",
    "uuid",
    "bigdecimal"
] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
printpdf = "0.5.3"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
